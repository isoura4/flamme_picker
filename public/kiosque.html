<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flamme Picker – Photo Kiosque</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="header-content">
    <div class="logo">🔥 Flamme Picker</div>
    <nav class="nav">
      <a href="/" class="nav-link">Commander</a>
      <a href="/memories.html" class="nav-link">Memories</a>
      <a href="/kiosque.html" class="nav-link active">📸 Photo</a>
    </nav>
  </div>
</header>

<main class="main-content">
  <div class="page-header">
    <h1>📸 Photo Kiosque</h1>
    <p>Prenez une photo souvenir et partagez-la dans nos Memories !</p>
  </div>

  <!-- Camera view -->
  <div class="kiosque-container" id="cameraView">
    <div class="kiosque-video-wrap">
      <video id="cameraFeed" autoplay playsinline></video>
      <canvas id="cameraCanvas" style="display:none"></canvas>
    </div>
    <div class="kiosque-controls">
      <button class="btn btn-primary btn-lg" id="captureBtn">📷 Prendre une photo</button>
    </div>
    <p id="cameraError" style="display:none;color:var(--danger);margin-top:0.75rem;font-size:0.85rem"></p>
  </div>

  <!-- Preview view -->
  <div class="kiosque-container" id="previewView" style="display:none">
    <div class="kiosque-preview-wrap">
      <div class="kiosque-preview-canvas-wrap">
        <canvas id="previewCanvas"></canvas>
        <img id="previewImg" src="" alt="Aperçu de la photo" style="display:none">
      </div>
    </div>

    <!-- Filters -->
    <div class="kiosque-filters">
      <h3>🎨 Filtres</h3>
      <div class="filter-options" id="filterOptions">
        <button class="filter-btn active" data-filter="none" title="Aucun filtre">
          <span class="filter-preview" style="background:#ddd"></span>
          <span>Normal</span>
        </button>
        <button class="filter-btn" data-filter="sepia" title="Sépia">
          <span class="filter-preview" style="background:linear-gradient(135deg,#d4a574,#8b6914)"></span>
          <span>Sépia</span>
        </button>
        <button class="filter-btn" data-filter="grayscale" title="Noir & Blanc">
          <span class="filter-preview" style="background:linear-gradient(135deg,#999,#333)"></span>
          <span>N&B</span>
        </button>
        <button class="filter-btn" data-filter="warm" title="Chaud">
          <span class="filter-preview" style="background:linear-gradient(135deg,#ff9a56,#e05a1a)"></span>
          <span>Chaud</span>
        </button>
        <button class="filter-btn" data-filter="cool" title="Froid">
          <span class="filter-preview" style="background:linear-gradient(135deg,#56c4ff,#1a6ee0)"></span>
          <span>Froid</span>
        </button>
        <button class="filter-btn" data-filter="bright" title="Lumineux">
          <span class="filter-preview" style="background:linear-gradient(135deg,#fff8e1,#ffc107)"></span>
          <span>Vif</span>
        </button>
        <button class="filter-btn" data-filter="vintage" title="Vintage">
          <span class="filter-preview" style="background:linear-gradient(135deg,#c19a6b,#6b4226)"></span>
          <span>Vintage</span>
        </button>
      </div>
    </div>

    <!-- Decorations -->
    <div class="kiosque-decorations">
      <h3>✨ Décorations</h3>
      <div class="decoration-options" id="decorationOptions">
        <button class="deco-btn" data-deco="confetti" title="Confettis">🎊 Confettis</button>
        <button class="deco-btn" data-deco="flamme" title="Parts de flammekueche">🫓 Flammes</button>
        <button class="deco-btn" data-deco="toque" title="Toque de chef">👨‍🍳 Toques</button>
        <button class="deco-btn" data-deco="stars" title="Étoiles">⭐ Étoiles</button>
        <button class="deco-btn" data-deco="hearts" title="Cœurs">❤️ Cœurs</button>
      </div>
    </div>

    <div class="form-group" style="max-width:400px;margin:1rem auto 0">
      <label for="photoCaption">Légende (optionnel)</label>
      <input type="text" id="photoCaption" placeholder="Décrivez votre photo…" maxlength="100">
      <button class="btn btn-secondary btn-sm" id="aiCaptionBtn" style="margin-top:0.5rem" type="button">🤖 Description IA</button>
    </div>
    <div class="kiosque-controls">
      <button class="btn btn-secondary" id="retakeBtn">↻ Reprendre</button>
      <button class="btn btn-success" id="validateBtn">✅ Valider et publier</button>
    </div>
  </div>

  <!-- Success view -->
  <div class="kiosque-container" id="successView" style="display:none">
    <div class="kiosque-success">
      <div class="modal-icon">🎉</div>
      <h2>Photo publiée !</h2>
      <p>Votre photo a été ajoutée aux Memories.</p>
      <div class="kiosque-controls">
        <a href="/memories.html" class="btn btn-secondary">Voir les Memories</a>
        <button class="btn btn-primary" id="newPhotoBtn">📷 Nouvelle photo</button>
      </div>
    </div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script src="/js/kiosque.js"></script>
</body>
</html>
